# Retags an ECR image to the target registry (e.g. Docker Hub) when a release PR is approved.
#
# - Regular releases (PR into main/master from rc/*, hotfix/*, ...):
#     ECR `latest` -> `<version>` and `latest`, where `<version>` is the semver from the PR title.
# - Patches of already released versions (PR from `patch/*`, any base branch):
#     ECR `<head commit sha>` -> `<version>` ONLY (version is the semver from the PR title). `latest` is never pushed, and an already existing
#     `X.Y.Z` tag is never overwritten. The caller's build must therefore tag the patch image
#     with the commit sha (additional-tag: ${{ github.sha }}) and must not tag it as `latest`.
name: Retag and Release Docker Image

on:
  workflow_call:
    inputs:
      aws-region:
        required: true
        type: string
      aws-role-arn:
        required: false
        type: string  
      ecr-repository:
        required: true
        type: string
        description: ECR repository name
      target-registry:
        required: true
        type: string
      target-repository:
        required: true
        type: string
      platforms:
        required: false
        type: string
        default: linux/amd64
      release-mode:
        required: false
        type: string
        default: rc
    secrets:
      AWS_ROLE_ARN:
        required: false
        description: 'IAM role ARN for OIDC authentication'
      ECR_REPOSITORY:
        required: false
        description: Optional; use inputs.ecr-repository instead to pass via vars
      REGISTRY_USERNAME:
        required: false
        description: 'Target registry username (preferred); REGESTRY_USERNAME accepted for backward compatibility)'
      REGISTRY_PASSWORD:
        required: false
        description: 'Target registry password (preferred); REGESTRY_PASSWORD accepted for backward compatibility)'
      REGESTRY_USERNAME:
        required: false
        description: 'Deprecated: use REGISTRY_USERNAME instead'
      REGESTRY_PASSWORD:
        required: false
        description: 'Deprecated: use REGISTRY_PASSWORD instead'

permissions:
  id-token: write
  contents: read
  pull-requests: read

jobs:
  retag-image:
    name: Retag and push Docker image
    runs-on: ubuntu-latest
    environment: rc

    if: >
      github.event.review.state == 'approved' &&
      (
        startsWith(github.event.pull_request.head.ref, 'patch/') ||
        (
          (github.event.pull_request.base.ref == 'main' ||
           github.event.pull_request.base.ref == 'master') &&
          !startsWith(github.event.pull_request.head.ref, 'secure/')
        )
      )

    env:
      ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY || inputs.ecr-repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || inputs.aws-role-arn }}
          aws-region: ${{ inputs.aws-region }}

      - name: Mask AWS account ID
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "::add-mask::${ACCOUNT_ID}"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Login to target registry
        uses: docker/login-action@v4
        with:
          registry: ${{ inputs.target-registry }}
          username: ${{ secrets.REGISTRY_USERNAME || secrets.REGESTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.REGESTRY_PASSWORD }}

      - name: Resolve version, source image and tags
        id: vars
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Version always comes from the PR title.
          TAG=$(echo "${PR_TITLE}" | sed -nE 's/.*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p')
          if [ -z "$TAG" ]; then
            echo "No semver found in PR title"
            exit 1
          fi
          if [[ "${HEAD_REF}" == patch/* ]]; then
            # Patch of an already released version: the image is the one built from
            # the approved commit, `latest` is not pushed.
            SOURCE_TAG="${HEAD_SHA}"
            IS_PATCH=true
          else
            SOURCE_TAG=latest
            IS_PATCH=false
          fi
          {
            echo "tag=${TAG}"
            echo "source-tag=${SOURCE_TAG}"
            echo "is-patch=${IS_PATCH}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Wait for the patch image built from the approved commit
        if: steps.vars.outputs.is-patch == 'true'
        env:
          SOURCE_TAG: ${{ steps.vars.outputs.source-tag }}
        run: |
          # The branch build may still be running when the PR is approved.
          for i in $(seq 1 60); do
            if aws ecr describe-images --repository-name "${ECR_REPOSITORY}" \
                 --image-ids imageTag="${SOURCE_TAG}" >/dev/null 2>&1; then
              echo "Image ${ECR_REPOSITORY}:${SOURCE_TAG} found in ECR"
              exit 0
            fi
            echo "Image ${ECR_REPOSITORY}:${SOURCE_TAG} is not in ECR yet (attempt ${i}/60), waiting..."
            sleep 30
          done
          echo "::error::No ECR image tagged with commit ${SOURCE_TAG}. Make sure the patch build succeeded for this commit and tagged it with the commit sha, then re-run this job."
          exit 1

      - name: Ensure patch version tag does not exist yet
        if: steps.vars.outputs.is-patch == 'true'
        env:
          IMAGE_TAG: ${{ steps.vars.outputs.tag }}
        run: |
          TARGET="${{ inputs.target-registry }}/${{ inputs.target-repository }}"
          if docker buildx imagetools inspect "${TARGET}:${IMAGE_TAG}" >/dev/null 2>&1; then
            echo "::error::${TARGET}:${IMAGE_TAG} already exists, refusing to overwrite it."
            exit 1
          fi

      - name: Retag and push image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.vars.outputs.tag }}
          SOURCE_TAG: ${{ steps.vars.outputs.source-tag }}
          IS_PATCH: ${{ steps.vars.outputs.is-patch }}
        run: |
          TARGET="${{ inputs.target-registry }}/${{ inputs.target-repository }}"
          TAG_ARGS=(--tag "${TARGET}:${IMAGE_TAG}")
          # Patches of old versions must never move the floating `latest` tag.
          if [ "${IS_PATCH}" != "true" ]; then
            TAG_ARGS+=(--tag "${TARGET}:latest")
          fi
          docker buildx imagetools create \
            "${ECR_REGISTRY}/${ECR_REPOSITORY}:${SOURCE_TAG}" \
            "${TAG_ARGS[@]}"

      - name: Summary
        env:
          IMAGE_TAG: ${{ steps.vars.outputs.tag }}
          IS_PATCH: ${{ steps.vars.outputs.is-patch }}
        run: |
          {
            echo "## Docker Release Summary"
            echo ""
            echo "- Image: ${{ inputs.target-registry }}/${{ inputs.target-repository }}:$IMAGE_TAG"
            if [ "${IS_PATCH}" = "true" ]; then
              echo "- Patch release: \`latest\` was not updated"
            fi
            echo "- Commit: [$GITHUB_SHA](https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA)"
          } >> $GITHUB_STEP_SUMMARY
