name: Build Docker image and push to registry

on:
  workflow_call:
    inputs:
      registry:
        description: 'Target registry: ecr | gcr | both'
        required: false
        type: string
        default: 'ecr'
      aws-region:
        description: 'AWS Region (required when registry is ecr or both)'
        required: false
        type: string
        default: 'us-east-1'
      ecr-repository:
        description: 'ECR Repository'
        required: false
        type: string
        default: ${{ github.event.repository.name }}
      gcr-region:
        description: 'GCP Artifact Registry hostname (e.g. europe-docker.pkg.dev)'
        required: false
        type: string
        default: 'europe-docker.pkg.dev'
      gcp-project:
        description: 'GCP project ID (optional if secret GCP_PROJECT is set)'
        required: false
        type: string
        default: ''
      gcr-repository:
        description: 'Image path under the GCP project (default: reportportal/<repo-name>)'
        required: false
        type: string
        default: ''
      build-platforms:
        description: 'Build platforms'
        required: false
        type: string
        default: 'linux/amd64'
      image-tag:
        description: 'Image tag'
        required: false
        type: string
        default: 'run-number-${{ github.run_number }}'
      additional-tag:
        description: 'Newline-separated list of extra image tags (tag names only, without registry/repo prefix)'
        required: false
        type: string
        default: ''
      version:
        description: 'Application version'
        required: false
        type: string
        default: ${{ github.ref_name }}
      branch:
        description: 'Build branch'
        required: false
        type: string
        default: ${{ github.ref_name }}
      date:
        description: 'Build date'
        required: false
        type: string
        default: ''
      release-mode:
        description: 'Release mode for application build'
        required: false
        type: boolean
        default: false
      scan-image:
        description: 'Scan image for vulnerabilities'
        required: false
        type: boolean
        default: false
      runs-on:
        description: 'Type of runner to use'
        required: false
        type: string
        default: 'ubuntu-latest'
    secrets:
      AWS_ROLE_ARN:
        description: 'IAM role ARN for OIDC authentication (required when registry is ecr or both)'
        required: false
      ECR_REPOSITORY:
        required: false
        description: 'Amazon ECR repository name'
      GCP_WORKLOAD_IDENTITY_PROVIDER:
        description: 'WIF provider resource name for keyless GCP auth (required when registry is gcr or both)'
        required: false
      GCP_SERVICE_ACCOUNT:
        description: 'GCP service account email to impersonate (required when registry is gcr or both)'
        required: false
      GCR_REGION:
        description: 'GCP Artifact Registry hostname; takes precedence over the gcr-region input'
        required: false
      GCP_PROJECT:
        description: 'GCP project ID; takes precedence over the gcp-project input'
        required: false
      GH_USER:
        description: 'GitHub user'
        required: false
      GH_TOKEN:
        description: 'GitHub token'
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ${{ inputs.registry }}
  AWS_REGION: ${{ inputs.aws-region }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY || inputs.ecr-repository }}
  GCR_REGION: ${{ secrets.GCR_REGION || inputs.gcr-region }}
  GCP_PROJECT: ${{ secrets.GCP_PROJECT || inputs.gcp-project }}
  GCR_REPOSITORY: ${{ inputs.gcr-repository }}
  PLATFORMS: ${{ inputs.build-platforms }}
  IMAGE_TAG: ${{ inputs.image-tag }}
  VERSION: ${{ inputs.version }}
  BRANCH: ${{ inputs.branch }}
  DATE: ${{ inputs.date }}
  RELEASE_MODE: ${{ inputs.release-mode }}

jobs:
  build-and-export:
    name: Build and export (${{ inputs.registry }})
    runs-on: ${{ inputs.runs-on }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Validate configuration
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: |
          case "${REGISTRY}" in
            ecr|gcr|both) ;;
            *)
              echo "::error::Invalid registry '${REGISTRY}'. Expected ecr, gcr, or both."
              exit 1
              ;;
          esac

          if [ "${REGISTRY}" = "ecr" ] || [ "${REGISTRY}" = "both" ]; then
            if [ -z "${AWS_ROLE_ARN}" ]; then
              echo "::error::AWS_ROLE_ARN secret is required when registry is '${REGISTRY}'."
              exit 1
            fi
          fi

          if [ "${REGISTRY}" = "gcr" ] || [ "${REGISTRY}" = "both" ]; then
            if [ -z "${GCP_WORKLOAD_IDENTITY_PROVIDER}" ]; then
              echo "::error::GCP_WORKLOAD_IDENTITY_PROVIDER secret is required when registry is '${REGISTRY}'."
              exit 1
            fi
            if [ -z "${GCP_SERVICE_ACCOUNT}" ]; then
              echo "::error::GCP_SERVICE_ACCOUNT secret is required when registry is '${REGISTRY}'."
              exit 1
            fi
            if [ -z "${GCR_REGION}" ]; then
              echo "::error::GCR region is empty. Set secret GCR_REGION or pass 'gcr-region' input."
              exit 1
            fi
            if [ -z "${GCP_PROJECT}" ]; then
              echo "::error::GCP project is empty. Set secret GCP_PROJECT or pass 'gcp-project' input."
              exit 1
            fi
          fi

      - name: Configure AWS credentials
        if: ${{ inputs.registry == 'ecr' || inputs.registry == 'both' }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Mask AWS account ID
        if: ${{ inputs.registry == 'ecr' || inputs.registry == 'both' }}
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "::add-mask::${ACCOUNT_ID}"

      - name: Login to Amazon ECR
        if: ${{ inputs.registry == 'ecr' || inputs.registry == 'both' }}
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: 'true'

      - name: Authenticate to GCP
        if: ${{ inputs.registry == 'gcr' || inputs.registry == 'both' }}
        id: gcp-auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          create_credentials_file: false

      - name: Login to GCP Artifact Registry
        if: ${{ inputs.registry == 'gcr' || inputs.registry == 'both' }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GCR_REGION }}
          username: oauth2accesstoken
          password: ${{ steps.gcp-auth.outputs.access_token }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute image tags
        id: tags
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ADDITIONAL_TAGS: ${{ inputs.additional-tag }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          TAGS=""
          PRIMARY_REF=""

          append_tags() {
            local prefix="$1"
            if [ -z "${TAGS}" ]; then
              TAGS="${prefix}:${IMAGE_TAG}"
            else
              TAGS="${TAGS}"$'\n'"${prefix}:${IMAGE_TAG}"
            fi
            while IFS= read -r tag; do
              if [ -n "${tag}" ]; then
                TAGS="${TAGS}"$'\n'"${prefix}:${tag}"
              fi
            done <<< "${ADDITIONAL_TAGS}"
          }

          if [ "${REGISTRY}" = "ecr" ] || [ "${REGISTRY}" = "both" ]; then
            if [ -z "${ECR_REGISTRY:-}" ]; then
              echo "::error::ECR login did not produce a registry hostname."
              exit 1
            fi
            append_tags "${ECR_REGISTRY}/${ECR_REPOSITORY}"
            PRIMARY_REF="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          fi

          if [ "${REGISTRY}" = "gcr" ] || [ "${REGISTRY}" = "both" ]; then
            GCR_REPO="${GCR_REPOSITORY}"
            if [ -z "${GCR_REPO}" ]; then
              GCR_REPO="reportportal/${REPO_NAME}"
            fi
            append_tags "${GCR_REGION}/${GCP_PROJECT}/${GCR_REPO}"
            if [ -z "${PRIMARY_REF}" ]; then
              PRIMARY_REF="${GCR_REGION}/${GCP_PROJECT}/${GCR_REPO}:${IMAGE_TAG}"
            fi
            echo "gcr_image=${GCR_REGION}/${GCP_PROJECT}/${GCR_REPO}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          fi

          {
            echo "tags<<EOF"
            echo "${TAGS}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "primary_ref=${PRIMARY_REF}" >> "$GITHUB_OUTPUT"

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ env.VERSION }}
            BUILD_BRANCH=${{ env.BRANCH }}
            BUILD_DATE=${{ env.DATE }}
            RELEASE_MODE=${{ env.RELEASE_MODE }}
            GITHUB_USER=${{ secrets.GH_USER }}
            GITHUB_TOKEN=${{ secrets.GH_TOKEN }}
          platforms: ${{ env.PLATFORMS }}
          tags: ${{ steps.tags.outputs.tags }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.35.0
        if: ${{ inputs.scan-image }}
        with:
          image-ref: ${{ steps.tags.outputs.primary_ref }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Summarize
        env:
          PRIMARY_REF: ${{ steps.tags.outputs.primary_ref }}
          GCR_IMAGE: ${{ steps.tags.outputs.gcr_image }}
          IMAGE_TAG: ${{ inputs.image-tag }}
        run: |
          {
            echo "## General information about the build:"
            echo ""
            echo "- Registry target: \`${REGISTRY}\`"
            if [ "${REGISTRY}" = "ecr" ] || [ "${REGISTRY}" = "both" ]; then
              echo "- Docker image in Amazon ECR: \`${ECR_REPOSITORY}:${IMAGE_TAG}\`"
            fi
            if [ "${REGISTRY}" = "gcr" ] || [ "${REGISTRY}" = "both" ]; then
              echo "- Docker image in GCP Artifact Registry: \`${GCR_IMAGE}\`"
            fi
            echo "- Primary image ref: \`${PRIMARY_REF}\`"
            echo "- The commit SHA from which the build was performed: [$GITHUB_SHA](https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA)"
          } >> "$GITHUB_STEP_SUMMARY"
